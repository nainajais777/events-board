services:
  db:
    image: postgres:17
    container_name: events-board-db
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events_dev_password
      POSTGRES_DB: events_board
    ports:
      - "5433:5432"
    volumes:
      - events_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_board"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  events_db_data: